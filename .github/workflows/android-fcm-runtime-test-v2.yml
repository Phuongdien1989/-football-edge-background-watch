name: Football Edge Android FCM Runtime Test V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/scripts/fcm-runtime-probe.sh'
      - '.github/workflows/android-fcm-runtime-test-v2.yml'

permissions:
  contents: read

jobs:
  android-fcm-runtime-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
      FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
      BACKGROUND_TOKEN: ${{ secrets.BACKGROUND_TOKEN }}
      BACKGROUND_WORKER_URL: https://football-edge-background-watch.ngophuonghuy.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM when available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            ls -l /dev/kvm
          fi

      - name: Verify required secrets are present
        shell: bash
        run: |
          test -n "${FIREBASE_GOOGLE_SERVICES_JSON:-}" || { echo 'Missing FIREBASE_GOOGLE_SERVICES_JSON'; exit 1; }
          test -n "${FCM_SERVICE_ACCOUNT_JSON:-}" || { echo 'Missing FCM_SERVICE_ACCOUNT_JSON'; exit 1; }
          test -n "${BACKGROUND_TOKEN:-}" || { echo 'Missing BACKGROUND_TOKEN'; exit 1; }
          echo 'Firebase + Background Worker secrets are present.'

      - name: Verify production Worker native capabilities
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
            const base=process.env.BACKGROUND_WORKER_URL.replace(/\/+$/,'');
            const r=await fetch(base+'/api/notify/native/capabilities',{headers:{authorization:'Bearer '+process.env.BACKGROUND_TOKEN,accept:'application/json'}});
            const raw=await r.text();let j={};try{j=JSON.parse(raw)}catch{j={raw}}
            console.log('WORKER_CAPS_HTTP='+r.status);
            if(!r.ok) throw new Error('Worker native capabilities HTTP '+r.status+' '+raw.slice(0,200));
            console.log('WORKER_NATIVE_ROUTE='+(j?.ok?'PASS':'FAIL'));
            console.log('WORKER_FCM_CONFIGURED='+(j?.fcm_configured===true?'PASS':'FAIL'));
            if(!j?.ok||j?.fcm_configured!==true) throw new Error('Worker native FCM is not ready');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Prepare native web baseline
        shell: bash
        run: |
          set -euo pipefail
          cd native
          mkdir -p www
          FRONTEND='https://shiny-silence-d892.ngophuonghuy.workers.dev'
          curl -fsSL --retry 3 "$FRONTEND/" -o www/index.html
          curl -fsSL --retry 3 "$FRONTEND/push-sw.js" -o www/push-sw.js
          echo '16fe0c6ef7b753af1fd62d8378dc9ba934f0f88baeac2835bdf7633d5571396c  www/index.html' | sha256sum -c -
          echo '8909f051ddaae2660ccda8cd32663af1c279b2b7b38d4f0ce4af34d3df4210eb  www/push-sw.js' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./native-shell.css">'
          js='<script src="./native-shell.js"></script>'
          if css not in s: s=s.replace('</head>',css+'\n</head>',1)
          if js not in s: s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install

      - name: Generate Android project
        working-directory: native
        run: npx cap add android

      - name: Inject Firebase config
        shell: bash
        run: |
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > native/android/app/google-services.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('native/android/app/google-services.json').read_text())
          packages=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in data.get('client',[])]
          assert 'vn.footballedge.app' in packages, packages
          print('Firebase package PASS: vn.footballedge.app')
          PY

      - name: Diagnose Firebase client registration auth
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          from pathlib import Path
          gs=json.loads(Path('native/android/app/google-services.json').read_text())
          sa=json.loads(os.environ['FCM_SERVICE_ACCOUNT_JSON'])
          project_id=gs.get('project_info',{}).get('project_id')
          project_number=str(gs.get('project_info',{}).get('project_number') or '')
          clients=[c for c in gs.get('client',[]) if c.get('client_info',{}).get('android_client_info',{}).get('package_name')=='vn.footballedge.app']
          assert clients, 'Android client not found'
          client=clients[0]
          app_id=client.get('client_info',{}).get('mobilesdk_app_id')
          api_keys=client.get('api_key') or []
          api_key=(api_keys[0] or {}).get('current_key') if api_keys else None
          print('PROJECT_MATCH=' + ('PASS' if project_id and project_id==sa.get('project_id') else 'FAIL'))
          print('PROJECT_NUMBER_PRESENT=' + ('PASS' if project_number else 'FAIL'))
          print('APP_ID_PRESENT=' + ('PASS' if app_id else 'FAIL'))
          print('API_KEY_PRESENT=' + ('PASS' if api_key else 'FAIL'))
          if not (project_id and app_id and api_key): raise SystemExit('Firebase client config incomplete')
          raw=bytearray(os.urandom(17)); raw[0]=(raw[0]&0x0F)|0x70
          fid=base64.urlsafe_b64encode(bytes(raw)).decode().rstrip('=')[:22]
          payload=json.dumps({'fid':fid,'appId':app_id,'authVersion':'FIS_v2','sdkVersion':'a:18.0.0'}).encode()
          req=urllib.request.Request(f'https://firebaseinstallations.googleapis.com/v1/projects/{project_id}/installations',data=payload,headers={'Content-Type':'application/json','Accept':'application/json','x-goog-api-key':api_key},method='POST')
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  r.read(); print('FIS_HTTP='+str(r.status)); print('FIS_CLIENT_AUTH=PASS')
          except urllib.error.HTTPError as e:
              body=e.read().decode('utf-8','replace'); print('FIS_HTTP='+str(e.code)); print('FIS_CLIENT_AUTH=FAIL'); print(body[:500]); raise
          PY

      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync android

      - name: Add CI-only FCM token probe with retry
        shell: bash
        run: |
          MAIN=$(find native/android/app/src/main -type f -name 'MainActivity.java' | head -n1)
          test -n "$MAIN"
          cat > "$MAIN" <<'JAVA'
          package vn.footballedge.app;

          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import com.getcapacitor.BridgeActivity;
          import com.google.firebase.messaging.FirebaseMessaging;

          public class MainActivity extends BridgeActivity {
            private int tokenAttempt = 0;
            private final Handler handler = new Handler(Looper.getMainLooper());

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              handler.postDelayed(this::fetchToken, 8000);
            }

            private void fetchToken() {
              tokenAttempt++;
              final int n = tokenAttempt;
              Log.i("FE_FCM_TEST", "TOKEN_ATTEMPT=" + n);
              FirebaseMessaging.getInstance().getToken().addOnCompleteListener(task -> {
                if (task.isSuccessful() && task.getResult() != null && !task.getResult().isEmpty()) {
                  Log.i("FE_FCM_TEST", "TOKEN=" + task.getResult());
                  return;
                }
                Log.e("FE_FCM_TEST", "TOKEN_ERROR_ATTEMPT=" + n, task.getException());
                if (n < 8) handler.postDelayed(this::fetchToken, 10000);
                else Log.e("FE_FCM_TEST", "TOKEN_ERROR_FINAL");
              });
            }
          }
          JAVA
          python - <<'PY'
          from pathlib import Path
          p=Path('native/android/app/build.gradle')
          s=p.read_text()
          if 'firebase-messaging' not in s:
              s=s.replace('dependencies {','dependencies {\n    implementation "com.google.firebase:firebase-messaging:24.1.2"',1)
              p.write_text(s)
          PY

      - name: Build debug APK with FCM probe
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Run Android 11 emulator and verify FCM end-to-end
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/fcm-runtime-probe.sh

      - name: Upload runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-edge-fcm-runtime-report-v2
          path: /tmp/fcm-runtime-report.txt
          if-no-files-found: warn
          retention-days: 7
