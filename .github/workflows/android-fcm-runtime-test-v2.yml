name: Football Edge Android FCM Runtime Test V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/scripts/fcm-runtime-probe.sh'
      - '.github/workflows/android-fcm-runtime-test-v2.yml'

permissions:
  contents: read

jobs:
  android-fcm-runtime-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
      FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM when available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            ls -l /dev/kvm
          fi

      - name: Verify required secrets are present
        shell: bash
        run: |
          test -n "${FIREBASE_GOOGLE_SERVICES_JSON:-}" || { echo 'Missing FIREBASE_GOOGLE_SERVICES_JSON'; exit 1; }
          test -n "${FCM_SERVICE_ACCOUNT_JSON:-}" || { echo 'Missing FCM_SERVICE_ACCOUNT_JSON'; exit 1; }
          echo 'Required Firebase secrets are present.'

      - name: Prepare native web baseline
        shell: bash
        run: |
          set -euo pipefail
          cd native
          mkdir -p www
          FRONTEND='https://shiny-silence-d892.ngophuonghuy.workers.dev'
          curl -fsSL --retry 3 "$FRONTEND/" -o www/index.html
          curl -fsSL --retry 3 "$FRONTEND/push-sw.js" -o www/push-sw.js
          echo '16fe0c6ef7b753af1fd62d8378dc9ba934f0f88baeac2835bdf7633d5571396c  www/index.html' | sha256sum -c -
          echo '8909f051ddaae2660ccda8cd32663af1c279b2b7b38d4f0ce4af34d3df4210eb  www/push-sw.js' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./native-shell.css">'
          js='<script src="./native-shell.js"></script>'
          if css not in s: s=s.replace('</head>',css+'\n</head>',1)
          if js not in s: s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install

      - name: Generate Android project
        working-directory: native
        run: npx cap add android

      - name: Inject Firebase config
        shell: bash
        run: |
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > native/android/app/google-services.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('native/android/app/google-services.json').read_text())
          packages=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in data.get('client',[])]
          assert 'vn.footballedge.app' in packages, packages
          print('Firebase package PASS: vn.footballedge.app')
          PY

      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync android

      - name: Add CI-only FCM token probe
        shell: bash
        run: |
          MAIN=$(find native/android/app/src/main -type f -name 'MainActivity.java' | head -n1)
          test -n "$MAIN"
          cat > "$MAIN" <<'JAVA'
          package vn.footballedge.app;

          import android.os.Bundle;
          import android.util.Log;
          import com.getcapacitor.BridgeActivity;
          import com.google.firebase.messaging.FirebaseMessaging;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              FirebaseMessaging.getInstance().getToken().addOnCompleteListener(task -> {
                if (!task.isSuccessful()) {
                  Log.e("FE_FCM_TEST", "TOKEN_ERROR", task.getException());
                  return;
                }
                Log.i("FE_FCM_TEST", "TOKEN=" + task.getResult());
              });
            }
          }
          JAVA
          python - <<'PY'
          from pathlib import Path
          p=Path('native/android/app/build.gradle')
          s=p.read_text()
          if 'firebase-messaging' not in s:
              s=s.replace('dependencies {','dependencies {\n    implementation "com.google.firebase:firebase-messaging:24.1.2"',1)
              p.write_text(s)
          PY

      - name: Build debug APK with FCM probe
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Run emulator and verify FCM end-to-end
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/fcm-runtime-probe.sh

      - name: Upload runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-edge-fcm-runtime-report-v2
          path: /tmp/fcm-runtime-report.txt
          if-no-files-found: warn
          retention-days: 7
