name: Restore baseline and inspect sync failure
on:
  push:
    branches: [fix/production-notification-sync-20261009]
    paths: ['.github/workflows/sync-recovery.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read runtime error and restore exact original backend version
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKGROUND_TOKEN: ${{ secrets.BACKGROUND_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const root='https://football-edge-background-watch.ngophuonghuy.workers.dev';
          for(const path of ['/api/notify/ui-state','/api/notify/status']){
            const r=await fetch(root+path,{headers:{Authorization:'Bearer '+process.env.BACKGROUND_TOKEN},signal:AbortSignal.timeout(30000)});
            const d=await r.json().catch(()=>({}));
            console.log(JSON.stringify({path,status:r.status,error:d.error,message:d.message,schema:d.schema}));
          }
          const api='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/workers/scripts/football-edge-background-watch/deployments';
          const headers={Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'};
          const r=await fetch(api,{method:'POST',headers,body:JSON.stringify({strategy:'percentage',versions:[{version_id:'6c1b74e6-4327-4ce2-b5d7-5dc42803cf13',percentage:100}]})});
          const d=await r.json();console.log(JSON.stringify({rollback_http:r.status,success:d.success,errors:d.errors}));
          const v=await (await fetch(api,{headers})).json();console.log(JSON.stringify({active_versions:v.result?.deployments?.[0]?.versions}));
          if(!r.ok)process.exitCode=1;
          JS
