name: Verify V2 Mobile App
on:
  push:
    branches: [v2-raw-capture]
    paths: [".github/workflows/verify-v2-app.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify app shell
        run: |
          set -euo pipefail
          curl -fsS https://football-edge-v2-raw-capture.ngophuonghuy.workers.dev/v2 -o app.html
          grep -q "FOOTBALL EDGE V2" app.html
          grep -q "LIVE FOOTBALL INTELLIGENCE" app.html
          grep -q "SIGNALS" app.html
          grep -q "WATCH" app.html
          grep -q "DATA / VALIDATION" app.html
          grep -q "SETTINGS" app.html
          echo "APP_SHELL_PASS"
      - name: Verify V2 push transport
        run: |
          set -euo pipefail
          curl -fsS https://football-edge-v2-raw-capture.ngophuonghuy.workers.dev/api/v2/push/key -o push-key.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('push-key.json','utf8'));
          if(!d.ok || !/^[A-Za-z0-9_-]{80,100}$/.test(d.publicKey||'')) throw new Error('INVALID_VAPID_PUBLIC_KEY');
          console.log('PUSH_KEY_PASS len='+d.publicKey.length);
          NODE
          curl -fsS https://football-edge-v2-raw-capture.ngophuonghuy.workers.dev/v2-sw.js -o sw.js
          grep -q "addEventListener('push'" sw.js
          grep -q "notificationclick" sw.js
          curl -fsS https://football-edge-v2-raw-capture.ngophuonghuy.workers.dev/v2 -o v2.html
          grep -q "Background Push V2" v2.html
          grep -q "pushManager.subscribe" v2.html
          echo "PUSH_CLIENT_PASS"

      - name: Verify V2 overview API
        run: |
          set -euo pipefail
          curl -fsS https://football-edge-v2-raw-capture.ngophuonghuy.workers.dev/api/v2/overview -o overview.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('overview.json','utf8'));
          if(!d.ok) throw new Error(d.error||'OVERVIEW_NOT_OK');
          if(d.schema!=='FE_V2_APP_OVERVIEW_V2') throw new Error('WRONG_SCHEMA:'+d.schema);
          if(!Array.isArray(d.matches)) throw new Error('MATCHES_NOT_ARRAY');
          if(!Array.isArray(d.pre_matches)) throw new Error('PRE_MATCHES_NOT_ARRAY');
          if(!d.system || !d.scan) throw new Error('MISSING_SYSTEM_OR_SCAN');
          if(!d.collector || !d.validation) throw new Error('MISSING_STATUS_BLOCKS');
          console.log('OVERVIEW_PASS live='+d.matches.length+' pre='+d.pre_matches.length+' raw='+d.collector.counts.raw_snapshots+' stats='+d.collector.evidence.stats_payloads+' lineups='+d.collector.evidence.lineups_payloads+' health='+d.system.health+' scorable='+d.scan.live_scorable);
          console.log('TOP_LIVE='+JSON.stringify(d.scan.top_live||[]));
          console.log('PRE_READY='+d.pre_matches.filter(x=>x.pre_context?.status==='READY').length+' PRE_PARTIAL='+d.pre_matches.filter(x=>x.pre_context?.status==='PARTIAL').length);
          NODE
