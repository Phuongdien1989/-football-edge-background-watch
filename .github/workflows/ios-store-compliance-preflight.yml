name: Football Edge iOS Store Compliance Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - n1-ios-prep
    paths:
      - 'native/store-edition.manifest.json'
      - 'native/store-edition-patch.py'
      - 'native/www/**'
      - 'native/capacitor.config.ts'
      - 'native/package.json'
      - 'native/ios-push-patch.py'
      - '.github/workflows/ios-store-compliance-preflight.yml'

permissions:
  contents: read

jobs:
  store-preflight:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Xcode environment
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version

      - name: Prepare frozen P2.0.1 Store baseline
        shell: bash
        run: |
          set -euo pipefail
          cd native
          mkdir -p www
          FRONTEND='https://shiny-silence-d892.ngophuonghuy.workers.dev'
          curl -fsSL --retry 3 "$FRONTEND/" -o www/index.html
          curl -fsSL --retry 3 "$FRONTEND/push-sw.js" -o www/push-sw.js

          echo '16fe0c6ef7b753af1fd62d8378dc9ba934f0f88baeac2835bdf7633d5571396c  www/index.html' | sha256sum -c -
          echo '8909f051ddaae2660ccda8cd32663af1c279b2b7b38d4f0ce4af34d3df4210eb  www/push-sw.js' | sha256sum -c -

      - name: Apply compile-time Store Edition presentation patch
        shell: bash
        run: |
          set -euo pipefail
          cd native
          python3 store-edition-patch.py --index www/index.html --manifest store-edition.manifest.json

      - name: Inject native shell for Store preflight
        shell: bash
        run: |
          set -euo pipefail
          cd native
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./native-shell.css">'
          js='<script src="./native-shell.js"></script>'
          apns='<meta name="football-edge-apns-env" content="sandbox">'
          if apns not in s:
              s=s.replace('</head>',apns+'\n</head>',1)
          if css not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Store compliance static gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile native/store-edition-patch.py native/ios-push-patch.py
          node --check native/www/native-shell.js
          grep -q 'football-edge-store-edition" content="1' native/www/index.html
          grep -q 'FE_STORE_EDITION_PATCH_V1' native/www/index.html
          grep -q 'ANALYSIS STATE • ADVISORY' native/www/index.html
          grep -q 'MARKET CONTEXT • SHADOW' native/www/index.html
          grep -q 'STRONG SIGNAL' native/www/index.html
          ! grep -q 'ENTRY POLICY • ADVISORY' native/www/index.html
          ! grep -q 'FAIR PRICE & EDGE • SHADOW' native/www/index.html
          ! grep -q 'ENTRY SUITABLE</span>' native/www/index.html
          grep -q 'remote_feature_override_allowed.*false' native/store-edition.manifest.json
          echo 'Store compliance presentation gates PASS.'

      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install

      - name: Generate iOS project
        working-directory: native
        run: npx cap add ios

      - name: Sync Capacitor iOS
        working-directory: native
        run: npx cap sync ios

      - name: Apply PushNotifications bridge
        working-directory: native
        run: python3 ios-push-patch.py

      - name: Validate identifier and native push bridge
        shell: bash
        run: |
          set -euo pipefail
          grep -R 'vn.footballedge.app' native/ios/App/App.xcodeproj/project.pbxproj
          grep -q 'capacitorDidRegisterForRemoteNotifications' native/ios/App/App/AppDelegate.swift
          grep -q 'capacitorDidFailToRegisterForRemoteNotifications' native/ios/App/App/AppDelegate.swift
          echo 'Identifier + native push bridge PASS.'

      - name: Build Store Edition unsigned simulator app
        shell: bash
        run: |
          set -euo pipefail
          cd native
          if [ -d ios/App/App.xcworkspace ]; then
            XCCONTAINER=(-workspace ios/App/App.xcworkspace)
          else
            XCCONTAINER=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${XCCONTAINER[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo 'Store Edition unsigned simulator build PASS.'

      - name: Upload Store Edition preflight bundle
        uses: actions/upload-artifact@v4
        with:
          name: football-edge-ios-store-preflight
          path: |
            native/www/index.html
            native/store-edition.manifest.json
            native/ios
          if-no-files-found: error
          retention-days: 14
