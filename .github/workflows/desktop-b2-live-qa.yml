name: Desktop B2 integrated local HTTPS-readiness QA (NO DEPLOY)
on:
  push:
    branches:
      - feature/football-edge-desktop-b2-preview-20261015
    paths:
      - 'desktop-b2-live/**'
      - '.github/workflows/desktop-b2-live-qa.yml'
jobs:
  integration-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify phone production frontend unchanged, then download exact snapshot
        working-directory: desktop-b2-live
        run: |
          python3 - <<'PY'
          import hashlib,urllib.request
          url='https://shiny-silence-d892.ngophuonghuy.workers.dev/'
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
          b=urllib.request.urlopen(req,timeout=25).read()
          actual=hashlib.sha256(b).hexdigest()
          expected='aa4f0f6318cd52c14ff62b195c5ea04c5267107455924da44c9aa78169fe7f28'
          print('FE_B2_PHONE_BASELINE_SHA',actual,'SIZE',len(b))
          assert actual==expected, 'PHONE_PRODUCTION_BASELINE_CHANGED; STOP'
          open('baseline.html','wb').write(b)
          PY
      - name: Build isolated B2 frontend
        working-directory: desktop-b2-live
        run: |
          python3 build.py
          node --check source/desktop.js
          node --check worker.mjs
          test ! -e source/demo-data.js
          test ! -e source/preview-guard.js
      - name: Chromium localhost / responsive / storage regression
        working-directory: desktop-b2-live
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node test/browser.mjs
      - name: Wrangler bundle-only verification (no deploy)
        working-directory: desktop-b2-live
        run: |
          npm install --no-save wrangler@4
          npx wrangler deploy --dry-run --outdir /tmp/fe-b2-live-bundle
      - name: Commit details
        run: echo "FE_B2_QA_PASS_NO_PRODUCTION_DEPLOY ${{ github.sha }}"
