name: Isolated statistics test after owner closed all apps
on:
  push:
    branches: [fix/paused-watch-alarm-20261019]
    paths: ['.github/workflows/statistics-isolation-check.yml']
jobs:
  isolated-statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: football-edge-production
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Observe two quiet minutes, then one statistics request
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/statistics-isolation-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statistics-isolation-result
          path: statistics-isolation-result.json
