name: Prediction V2 B2-B9 Tests

on:
  push:
    branches:
      - work/prediction-v2-audit-20261006
    paths:
      - "prediction_v2/**"
      - "docs/FOOTBALL_EDGE_B3_SHADOW_PROBABILITY_2026-10-06.md"
      - "docs/FOOTBALL_EDGE_B4_MARKET_EDGE_RANKING_2026-10-06.md"
      - "docs/FOOTBALL_EDGE_B5_VALIDATION_2026-10-06.md"
      - "worker_notify_v138_provider_quota75k.js"
      - ".github/workflows/prediction-v2-b3-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: B2 regression
        run: node prediction_v2/test-b2.mjs
      - name: B3 shadow probability
        run: node prediction_v2/test-b3.mjs
      - name: B4 market edge and ranking
        run: node prediction_v2/test-b4.mjs
      - name: B5 validation and old-vs-new
        run: node prediction_v2/test-b5.mjs
      - name: B7-B9 evidence and promotion
        run: node prediction_v2/test-b7-b9.mjs
      - name: Syntax check
        run: |
          node --check prediction_v2/api-budget-manager.js
          node --check prediction_v2/context-feature-layer.js
          node --check prediction_v2/live-feature-adapter.js
          node --check prediction_v2/probability-engine.js
          node --check prediction_v2/shadow-evidence.js
          node --check prediction_v2/shadow-live-bridge.js
          node --check prediction_v2/market-edge.js
          node --check prediction_v2/market-adapter.js
          node --check prediction_v2/opportunity-ranking.js
          node --check prediction_v2/validation-metrics.js
          node --check prediction_v2/old-vs-new-comparator.js
          node --check prediction_v2/paper-market-evidence.js
          node --check prediction_v2/shadow-universe-runner.js
          node --check prediction_v2/validation-sync.js
          node --check prediction_v2/validation-report.js
          node --check prediction_v2/staging-sidecar.js
          node --check worker_notify_v138_provider_quota75k.js
