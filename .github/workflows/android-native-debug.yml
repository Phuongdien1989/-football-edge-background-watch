name: Football Edge Android Debug

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - native-cloud-build
      - n1-firebase-setup
    paths:
      - 'native/**'
      - 'worker_notify_v132_native.js'
      - '.github/workflows/android-native-debug.yml'

permissions:
  contents: read

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare frozen web baseline
        shell: bash
        run: |
          set -euo pipefail
          cd native
          mkdir -p www

          FRONTEND='https://shiny-silence-d892.ngophuonghuy.workers.dev'
          curl -fsSL --retry 3 "$FRONTEND/" -o www/index.html
          curl -fsSL --retry 3 "$FRONTEND/push-sw.js" -o www/push-sw.js

          echo '16fe0c6ef7b753af1fd62d8378dc9ba934f0f88baeac2835bdf7633d5571396c  www/index.html' | sha256sum -c -
          echo '8909f051ddaae2660ccda8cd32663af1c279b2b7b38d4f0ce4af34d3df4210eb  www/push-sw.js' | sha256sum -c -

          python - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./native-shell.css">'
          js='<script src="./native-shell.js"></script>'
          if css not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Static syntax checks
        run: |
          node --check native/www/native-shell.js
          node --check worker_notify_v132_native.js

      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install

      - name: Generate Android project
        working-directory: native
        run: npx cap add android

      - name: Inject Firebase Android config when available
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          TARGET='native/android/app/google-services.json'
          if [ -n "${FIREBASE_GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > "$TARGET"
            echo "Firebase Android config injected from raw JSON secret."
          elif [ -n "${FIREBASE_GOOGLE_SERVICES_JSON_B64:-}" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > "$TARGET"
            echo "Firebase Android config injected from base64 secret."
          else
            echo "Firebase Android config not configured yet; building shell without FCM runtime registration."
          fi

          if [ -f "$TARGET" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('native/android/app/google-services.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          packages=[]
          for client in data.get('client',[]):
              name=(client.get('client_info',{}).get('android_client_info',{}).get('package_name'))
              if name: packages.append(name)
          expected='vn.footballedge.app'
          if expected not in packages:
              raise SystemExit(f'google-services.json does not contain expected package {expected}; found {packages}')
          print(f'Firebase package verified: {expected}')
          PY
          fi

      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync android

      - name: Build debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: football-edge-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
