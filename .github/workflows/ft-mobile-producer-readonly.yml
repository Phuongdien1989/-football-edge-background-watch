name: FT Mobile producer source markers read-only
on:
  push:
    branches: [fix/ft-foundation-20261021]
    paths: ['ft-audit-fix/mobile-producer-readonly.mjs','.github/workflows/ft-mobile-producer-readonly.yml']
permissions: {contents: read}
concurrency: {group: ft-mobile-producer-readonly-once, cancel-in-progress: false}
jobs:
  verify:
    if: contains(github.event.head_commit.message,'[fe-mobile-src-readonly-once]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: football-edge-production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read authenticated Mobile Worker source ONLY, report marker booleans
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FT_MOBILE_CODE_READONLY_ONCE: CONFIRM
        run: node ft-audit-fix/mobile-producer-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ft-mobile-producer-readonly, path: ft-audit-output/ft-mobile-producer-readonly.json, retention-days: 30}
