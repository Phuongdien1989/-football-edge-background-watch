name: HT visual fidelity correction and full-screen verification
on:
  push:
    branches: [fix/ht-visual-fidelity-20261030]
    paths: ['ht-visual-release/**', 'ht-early-candidate/**', '.github/workflows/ht-visual-release.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: fe-football-edge-mobile-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: football-edge-production
    env: {WRANGLER_SEND_METRICS: 'false'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: ht-visual-release-proof
          run-id: 40990043537
          github-token: ${{ github.token }}
          path: ht-visual-baseline
      - name: Probability meaning, HT model, settlement and session regression
        run: |
          node ht-early-candidate/test-probability-view.mjs
          node ht-early-candidate/test-glance-view.mjs
          node ht-early-candidate/test-model.mjs
          node ht-early-candidate/test-valuation.mjs
          node ht-early-candidate/test-session.mjs
          node --check ht-early-candidate/ui.mjs
          node --check ht-visual-release/release.mjs
      - run: npm install --no-save --no-package-lock wrangler@4 playwright@1.58.2
      - name: Verify current app and preserve all 49 assets and rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ht-visual-release/release.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: pre-ht-visual-mobile-backup
          path: |
            ht-visual-package/backup/
            ht-visual-package/backup-version.json
            ht-visual-package/manifest.json
          retention-days: 90
      - name: Candidate HT probabilities and existing HT, FT and HC at four widths
        run: node ht-visual-release/test-browser.cjs
      - run: npx --no-install wrangler deploy --dry-run --config ht-visual-package/wrangler.json
      - name: Publish complete Mobile bundle with corrected HT proportions
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ht-visual-release/release.mjs deploy
      - name: Verify published HT percentages, price independence, HT retention, FT and HC
        run: node ht-visual-release/test-browser.cjs --production
      - name: Verify all 49 hashes, backend, Desktop and scanner state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ht-visual-release/release.mjs verify
      - name: Restore Mobile if post-publish checks fail
        if: failure() && steps.publish.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ht-visual-release/release.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ht-visual-release-proof
          path: ht-visual-package/
          retention-days: 90
