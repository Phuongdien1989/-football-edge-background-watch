name: Read-only provider error trace
on:
  push:
    branches: [fix/ultra75k-budget-isolated-20261010]
    paths: ['.github/workflows/diagnose-ultra-provider.yml']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-audit --no-fund wrangler@4.119.0
      - name: Observe provider warning messages only, never print headers or credentials
        run: |
          node --input-type=module <<'JS'
          import {spawn} from 'node:child_process';
          const p=spawn(process.execPath,['node_modules/wrangler/bin/wrangler.js','tail','football-edge-background-watch','--format','json'],{env:process.env});
          let buffer='',seen=0,warnings=[],errors='';
          p.stdout.on('data',chunk=>{buffer+=chunk;let i;while((i=buffer.indexOf('\n'))>=0){const line=buffer.slice(0,i);buffer=buffer.slice(i+1);try{const d=JSON.parse(line);seen++;for(const l of d.logs||[]){const text=(l.message||[]).join(' ');if(text.startsWith('api warning'))warnings.push(text.replaceAll(process.env.CLOUDFLARE_API_TOKEN,'[REDACTED]').slice(0,700))}}catch{}}});
          p.stderr.on('data',c=>{errors+=c.toString().replaceAll(process.env.CLOUDFLARE_API_TOKEN,'[REDACTED]').slice(0,400)});
          await new Promise(resolve=>{const timer=setTimeout(()=>{p.kill('SIGTERM');resolve()},40000);p.on('exit',()=>{clearTimeout(timer);resolve()})});
          console.log('PROVIDER_WARNING_TRACE '+JSON.stringify({seen,warnings:[...new Set(warnings)].slice(0,20),cli_errors:errors.slice(0,1000)}));
          const r=await fetch('https://football-edge-background-watch.ngophuonghuy.workers.dev/api/notify/status',{headers:{Authorization:'Bearer '+process.env.BACKGROUND_TOKEN},signal:AbortSignal.timeout(30000)});const d=await r.json();console.log('PROVIDER_TRACE_STATUS '+JSON.stringify({http:r.status,quota:d.global_api_quota,scan:d.scan?.errors,live:d.scan?.live,scanned:d.scan?.scanned,at:d.scan?.at}));
          JS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKGROUND_TOKEN: ${{ secrets.BACKGROUND_TOKEN }}
