name: Shared visual design for Overview FT HC and FT AI V2
on:
  push:
    branches: [feat/all-mechanisms-visual-20261030]
    paths: ['all-mechanisms-release/**', 'ui-common/**', 'ft-overview/**', 'hc-model/view.mjs', '.github/workflows/all-mechanisms-release.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: fe-football-edge-mobile-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: football-edge-production
    env: {WRANGLER_SEND_METRICS: 'false'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: ht-visual-release-proof
          run-id: 40990487218
          github-token: ${{ github.token }}
          path: all-mechanisms-baseline
      - name: Pure views and probability meaning regressions
        run: |
          node all-mechanisms-release/test-views.mjs
          node ft-overview/test-light-signal-pro-view.mjs
          node --check hc-model/view.mjs
          node --check all-mechanisms-release/release.mjs
      - run: npm install --no-save --no-package-lock wrangler@4 playwright@1.58.2
      - name: Verify current app and preserve all 49 assets and rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node all-mechanisms-release/release.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: pre-all-mechanisms-mobile-backup
          path: |
            all-mechanisms-package/backup/
            all-mechanisms-package/backup-version.json
            all-mechanisms-package/manifest.json
          retention-days: 90
      - name: Candidate all six tabs and existing HT retention at four widths
        run: node all-mechanisms-release/test-browser.cjs
      - run: npx --no-install wrangler deploy --dry-run --config all-mechanisms-package/wrangler.json
      - name: Publish complete Mobile bundle with consistent mechanism cards
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node all-mechanisms-release/release.mjs deploy
      - name: Verify published HT percentages, price independence, HT retention, FT and HC
        run: node all-mechanisms-release/test-browser.cjs --production
      - name: Verify all 50 hashes, backend, Desktop and scanner state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node all-mechanisms-release/release.mjs verify
      - name: Restore Mobile if post-publish checks fail
        if: failure() && steps.publish.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node all-mechanisms-release/release.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-mechanisms-release-proof
          path: all-mechanisms-package/
          retention-days: 90
