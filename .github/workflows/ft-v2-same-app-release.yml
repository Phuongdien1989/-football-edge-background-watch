name: FT V2 Light Signal Pro guarded Mobile release
on:
  push:
    branches: [fix/ft-foundation-20261021]
    paths:
      - .github/workflows/ft-v2-same-app-release.yml
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: football-edge-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node ft-overview/test-light-signal-pro-view.mjs
      - run: node ft-overview/test-same-app-integration.mjs
      - run: node ft-overview/test-experimental-decision.mjs
      - run: node ft-overview/test-live-probability.mjs
      - run: node --check ft-overview/release-current-main-app.mjs
      - name: Release exact pinned Mobile preserving 28 assets and rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FT_V2_SAME_APP_RELEASE: APPROVED_20261024
          FT_V2_COMPLETE_MANIFEST_VERIFIED: RECOVERY_28_VERIFIED_20261023
        run: node ft-overview/release-current-main-app.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft-v2-light-signal-pro-guarded-release
          path: ft-overview/current-main-app-package/result.json
