name: FT V2 — same Mobile app packaging preflight
on:
  push:
    branches: [fix/ft-foundation-20261021]
    paths:
      - 'ft-overview/release-current-main-app.mjs'
      - 'ft-overview/current-shell-injection.mjs'
      - 'ft-overview/ft-ai-v2-integrated.mjs'
      - '.github/workflows/ft-v2-same-app-release.yml'
permissions: {contents: read}
jobs:
  current_app:
    if: startsWith(github.event.head_commit.message, 'release(ft-v2): owner-reviewed light signal pro production')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: football-edge-production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node ft-overview/test-same-app-integration.mjs
      - run: node --check ft-overview/ft-ai-v2-integrated.mjs
      - run: node ft-overview/test-experimental-decision.mjs
      - run: node ft-overview/test-live-probability.mjs
      - name: Package against current live Mobile version; release guarded by audited restored 28-asset inventory and active version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FT_V2_SAME_APP_RELEASE: APPROVED_20261024
          FT_V2_COMPLETE_MANIFEST_VERIFIED: RECOVERY_28_VERIFIED_20261023
        run: node ft-overview/release-current-main-app.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft-v2-current-main-app-package
          path: |
            ft-overview/current-main-app-package/result.json
            ft-overview/current-main-app-package/wrangler.json
