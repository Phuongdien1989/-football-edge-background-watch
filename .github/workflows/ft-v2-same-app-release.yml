name: FT V2 Light Signal Pro release preparation — NO deploy
on:
  push:
    branches: [fix/ft-foundation-20261021]
    paths:
      - 'ft-overview/**'
      - '.github/workflows/ft-v2-same-app-release.yml'
permissions: {contents: read}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node ft-overview/test-light-signal-pro-view.mjs
      - run: node ft-overview/test-same-app-integration.mjs
      - run: node --check ft-overview/release-current-main-app.mjs
