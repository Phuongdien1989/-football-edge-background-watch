name: Guarded Ultra75k Worker and Batch D production verification
on:
  push:
    branches: [fix/ultra75k-budget-isolated-20261010]
    paths: ['.github/workflows/deploy-ultra75k.yml']
concurrency:
  group: football-edge-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y xvfb webkit2gtk-driver
      - run: node tests/test-ultra-budget-config.mjs
      - run: node --experimental-vm-modules tests/test-ultra-budget-runtime.mjs
      - run: node sync-fix/build.cjs
      - run: node sync-fix/tests/test-top.cjs
      - run: node --experimental-vm-modules sync-fix/tests/test-worker.mjs
      - run: node --experimental-vm-modules sync-fix/tests/test-accuracy.mjs
      - run: python3 sync-fix/tests/test-browser.py
      - run: node tests/preflight-ultra.mjs
        env:
          BACKGROUND_TOKEN: ${{ secrets.BACKGROUND_TOKEN }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
  deploy:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y xvfb webkit2gtk-driver
      - run: npm install --no-save --no-audit --no-fund wrangler@4.119.0
      - run: node sync-fix/build.cjs
      - name: Deploy backend, preserve counters, verify real scanner and independently settle Batch D
        run: node sync-fix/deploy-ultra75k.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKGROUND_TOKEN: ${{ secrets.BACKGROUND_TOKEN }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultra75k-production-and-rollback-evidence
          path: |
            sync-fix/evidence-ultra75k/
            accuracy-independent-check/
          retention-days: 90
