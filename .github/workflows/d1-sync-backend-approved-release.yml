name: APPROVED Football Edge D1 backend-only release with rollback
on:
  push:
    branches:
      - release/d1-sync-backend-approved-20261016
    paths:
      - '.github/workflows/d1-sync-backend-approved-release.yml'
jobs:
  approved-backend-only:
    if: github.ref == 'refs/heads/release/d1-sync-backend-approved-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment: football-edge-production
    concurrency:
      group: fe-production-backend-release-20261016
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout release supervisor, not the runtime
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout ONLY owner's exact approved immutable backend commit
        uses: actions/checkout@v4
        with:
          ref: 3c97629e51251c56f9edeb8d0f67a7a0dad957a2
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable source and release supervisor syntax
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "3c97629e51251c56f9edeb8d0f67a7a0dad957a2"
          node --check .github/scripts/d1-sync-backend-approved-release.mjs
          node --check candidate/worker.js
          node --check candidate/worker_v122.js
          node --check candidate/worker_v123.js
          test -f candidate/d1-production-meter.mjs
          echo FE_D1_SYNC_PINNED_SOURCE_VERIFIED
      - name: Install Wrangler for approved backend only (does NOT deploy)
        working-directory: candidate
        run: npm install --no-save wrangler@4
      - name: Reverify production then deploy ONLY approved backend; rollback on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: candidate
          WRANGLER_SEND_METRICS: 'false'
        run: node .github/scripts/d1-sync-backend-approved-release.mjs
      - name: Preserve sanitized actual deployment, health and rollback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-sync-backend-approved-prod-release
          path: d1-sync-backend-production-result.json
          if-no-files-found: ignore
