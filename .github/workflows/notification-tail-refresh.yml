name: Notification bounded runtime refresh diagnostic
on:
  push:
    branches: [feat/mechanism-notifications-20261030]
    paths: ['notification-recovery/tail-refresh.mjs', '.github/workflows/notification-tail-refresh.yml']
permissions: {contents: read}
concurrency:
  group: fe-football-edge-mobile-production
  cancel-in-progress: false
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[runtime-refresh]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: football-edge-production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node notification-recovery/tail-refresh.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notification-tail-refresh
          path: tail-refresh.json
          retention-days: 90
