name: FT real cohort source read-only check
on:
  push:
    branches: [fix/ft-foundation-20261021]
    paths: ['ft-audit-fix/cohort-source-readonly.mjs', '.github/workflows/ft-cohort-source-readonly.yml']
permissions: {contents: read}
concurrency: {group: ft-cohort-source-readonly, cancel-in-progress: false}
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[ft-cohort-source-once]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: football-edge-production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read current UTC usage then inspect replay schema only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_READ_ONLY_AUDIT_ONCE: CONFIRM
        run: |
          node ft-audit-fix/d1-readonly-analytics.mjs
          node ft-audit-fix/cohort-source-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft-cohort-source-readonly
          path: |
            ft-audit-output/ft-cohort-source-readonly.json
            ft-audit-output/ft-d1-readonly-usage.json
          retention-days: 30
