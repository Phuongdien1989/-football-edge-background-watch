name: PR7 gated production meter-only rollout
on:
  pull_request:
    paths:
      - '.github/workflows/d1-meter-production-release.yml'
      - '.github/scripts/d1-meter-release.mjs'
jobs:
  meter-release:
    if: github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'diag/d1-production-meter-only-20261014' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: football-edge-production
    concurrency:
      group: fe-pr7-meter-only-production
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact safe rollback script syntax
        run: node --check .github/scripts/d1-meter-release.mjs
      - name: Install Worker bundler without changing repository files
        run: npm install --no-save wrangler@4
      - name: Deploy meter ONLY with automatic rollback on any failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/d1-meter-release.mjs
      - name: Preserve sanitized deployment proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7-meter-production-gated-result
          path: pr7-meter-production-result.json
          if-no-files-found: ignore
