name: DO Free isolated regression
on:
  pull_request:
    paths:
      - 'worker_notify_v136_hot_priority.js'
      - 'worker_notify_v135_full_pause.js'
      - 'worker_notify_v130.js'
      - 'worker_notify_v127.js'
      - 'tests/test-do-free-scan-control-idempotent.mjs'
      - 'tests/test-do-free-scan-control-runtime.mjs'
      - 'tests/test-do-free-empty-fixture.mjs'
      - 'tests/test-do-free-status-throttle.mjs'
      - 'tests/test-do-free-budget-no-rewrite.mjs'
      - 'tests/test-do-free-write-floor.mjs'
      - 'tests/test-do-free-pause-no-rewrite.mjs'
      - 'tests/test-do-free-write-throttle.mjs'
      - 'tests/test-do-free-runtime.mjs'
      - 'tests/test-do-free-entrypoint.mjs'
      - 'tests/test-do-free-quota-runtime.mjs'
      - 'tests/test-do-free-d1-live-state.mjs'
      - 'wrangler.toml'
      - 'worker_notify_v137_quota50000.js'
      - '.github/workflows/test-do-free-isolated.yml'
      - '.github/workflows/deploy-d1-candidate.yml'
      - '.github/scripts/cloudflare-readonly-preflight.mjs'
  workflow_dispatch:
jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: |
          node --check worker_notify_v136_hot_priority.js
          node --check worker_notify_v137_quota50000.js
          node --check worker_notify_v130.js
          node --check tests/test-do-free-write-floor.mjs
          node --check tests/test-do-free-d1-live-state.mjs
      - name: Validate Cloudflare Worker deploy bundle (no credentials)
        run: |
          npm install --no-save wrangler@4
          npx wrangler deploy --dry-run --outdir /tmp/fe-d1-bundle
      - name: Verify DO throttle and push scan invariants
        run: node tests/test-do-free-write-throttle.mjs
      - name: Simulate scheduler runtime writes
        run: node tests/test-do-free-runtime.mjs
      - name: Verify deployed entrypoint inheritance
        run: node tests/test-do-free-entrypoint.mjs
      - name: Verify prepaid quota block runtime behavior
        run: node tests/test-do-free-quota-runtime.mjs
      - name: Verify paused alarms do not rewrite status
        run: node tests/test-do-free-pause-no-rewrite.mjs
      - name: Verify budget change-only persistence
        run: node tests/test-do-free-budget-no-rewrite.mjs
      - name: Quantify DO write lower bound (diagnostic, not a release approval)
        run: node tests/test-do-free-write-floor.mjs
      - name: Verify idempotent scan pause/resume
        run: node tests/test-do-free-scan-control-idempotent.mjs
      - name: Execute scan-control runtime regression
        run: node tests/test-do-free-scan-control-runtime.mjs
      - name: Verify empty fixture write guard
        run: node tests/test-do-free-empty-fixture.mjs
      - name: Verify status write throttle
        run: node tests/test-do-free-status-throttle.mjs
      - name: Verify D1 LIVE state migration and dedup regression
        run: node tests/test-do-free-d1-live-state.mjs
      - name: Enforce official DO and D1 Workers Free write limits
        env:
          REQUIRE_DO_FREE_SAFE: '1'
          API_DAILY_CALLS: '50000'
          SCAN_TICKS_PER_DAY: '2880'
          FIXTURES_PER_TICK: '12'
          API_RESERVATION_BLOCK_SIZE: '64'
        run: node tests/test-do-free-write-floor.mjs

  cloudflare-readonly-preflight:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 5 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/do-free-isolated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment: football-edge-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read credentials availability, production versions and D1 schema (no deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FE_ROLLBACK_VERSION_ID: ${{ vars.FE_ROLLBACK_VERSION_ID || '60781a4e-70cb-4c02-a036-2528c3048ed5' }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/cloudflare-readonly-preflight.mjs
      - name: Preserve read-only preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-readonly-preflight
          path: cloudflare-readonly-preflight.json
          if-no-files-found: ignore
