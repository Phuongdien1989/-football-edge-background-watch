name: HT acceptance and old-version preservation
on:
  push:
    branches: [feature/ht-early-evidence-20261020]
    paths: ['audits/scripts/ht-acceptance-preserve.mjs', '.github/workflows/ht-acceptance-preserve.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: football-edge-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: football-edge-ht-complete-candidate
          run-id: 39491133238
          github-token: ${{ github.token }}
          path: accept-package
      - name: Validate backup hashes, immutable rollback versions and unchanged production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node audits/scripts/ht-acceptance-preserve.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ht-acceptance-preserve-evidence
          path: accept-evidence/
          retention-days: 90
