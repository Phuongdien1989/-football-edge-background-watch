name: Deploy Frontend P2055 FT HC Watchdog

on:
  push:
    branches:
      - hotfix/frontend-p2055-ft-hc-watchdog-20261007
    paths:
      - ".github/workflows/deploy-frontend-p2055-ft-hc-watchdog.yml"
      - ".deploy/p2055/patch-ft-hc-watchdog.py"
  workflow_dispatch:

concurrency:
  group: football-edge-frontend-p2055-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy shiny-silence-d892 P2055 FT HC watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVICE_NAME: shiny-silence-d892
      SERVICE_URL: https://shiny-silence-d892.ngophuonghuy.workers.dev
      BASE_ARTIFACT_RUN_ID: "36998717198"
      BASE_ARTIFACT_NAME: FOOTBALL_EDGE_CURRENT_SOURCE_SANITIZED_2026-10-02
      EXPECTED_BASE_SHA256: f2d5c471c247ed77b07e3cb9096e5c04ae9c69b4d8af1b25a4fbe7ca955bfb5c
      EXPECTED_P2052_SHA256: a82bf87e1db875fb975b94ac9b6df9e785818de37b7bb55fec6f290efca9c844
      EXPECTED_P2053_SHA256: ab02d1eb428048bd00a69f56c3e5a16bed3c107feb66110c3ab08a9e84a05069
      EXPECTED_P2054_SHA256: 1795f265f5af3c8266806d964c60f12e4fb0c86a25e477ca4ecc031e1f302b08
      P2053_MARKER: FE P2.0.5.3 HIDE RESEARCH CARDS 2026-10-07
      P2054_MARKER: FE P2.0.5.4 H1 SCREEN WATCHDOG 2026-10-07
      P2055_MARKER: FE P2.0.5.5 FT+HC SCREEN WATCHDOG 2026-10-07

    steps:
      - uses: actions/checkout@v4

      - name: Guard exact branch and production target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "hotfix/frontend-p2055-ft-hc-watchdog-20261007"
          test "$SERVICE_NAME" = "shiny-silence-d892"
          test "$SERVICE_NAME" != "football-edge-background-watch"
          echo "P2055 target guard PASS"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install pinned Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4.119.0

      - name: Download frozen frontend baseline
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT_NAME }}
          path: /tmp/fe-base-artifact
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_ARTIFACT_RUN_ID }}

      - name: Reconstruct exact P2054 and apply P2055
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fe-source /tmp/fe-p2055/public /tmp/fe-evidence
          INNER="$(find /tmp/fe-base-artifact -type f -name '*.zip' -print -quit)"
          test -n "$INNER"
          unzip -q "$INNER" -d /tmp/fe-source
          BASE="$(find /tmp/fe-source -type f -path '*/frontend/index.html' -print -quit)"
          test -f "$BASE"
          test "$(sha256sum "$BASE" | awk '{print $1}')" = "$EXPECTED_BASE_SHA256"

          cp "$BASE" /tmp/fe-p2055/public/index.html
          patch -p1 -d /tmp/fe-p2055/public < "$GITHUB_WORKSPACE/.deploy/p2052/site.patch"
          test "$(sha256sum /tmp/fe-p2055/public/index.html | awk '{print $1}')" = "$EXPECTED_P2052_SHA256"

          python "$GITHUB_WORKSPACE/.deploy/p2053/patch-hide-research.py" /tmp/fe-p2055/public/index.html >/tmp/fe-evidence/p2053-rebuild-sha.txt
          test "$(sha256sum /tmp/fe-p2055/public/index.html | awk '{print $1}')" = "$EXPECTED_P2053_SHA256"

          python "$GITHUB_WORKSPACE/.deploy/p2054/patch-h1-watchdog.py" /tmp/fe-p2055/public/index.html >/tmp/fe-evidence/p2054-rebuild-sha.txt
          test "$(sha256sum /tmp/fe-p2055/public/index.html | awk '{print $1}')" = "$EXPECTED_P2054_SHA256"
          cp /tmp/fe-p2055/public/index.html /tmp/fe-evidence/p2054-before.html

          python "$GITHUB_WORKSPACE/.deploy/p2055/patch-ft-hc-watchdog.py" /tmp/fe-p2055/public/index.html | tee /tmp/fe-evidence/p2055-build-sha.txt
          EXPECTED_P2055_SHA="$(sha256sum /tmp/fe-p2055/public/index.html | awk '{print $1}')"
          echo "$EXPECTED_P2055_SHA  P2055/index.html" | tee /tmp/fe-evidence/p2055.sha256

          grep -Fq "$P2053_MARKER" /tmp/fe-p2055/public/index.html
          grep -Fq "$P2054_MARKER" /tmp/fe-p2055/public/index.html
          grep -Fq "$P2055_MARKER" /tmp/fe-p2055/public/index.html
          grep -Fq 'H1_SCREEN_FIXTURE_TIMEOUT_MS=40000' /tmp/fe-p2055/public/index.html
          grep -Fq 'FT_SCREEN_FIXTURE_TIMEOUT_MS=40000' /tmp/fe-p2055/public/index.html
          grep -Fq 'HC_SCREEN_FIXTURE_TIMEOUT_MS=40000' /tmp/fe-p2055/public/index.html
          grep -Fq '.fmd-card,.mt-intel' /tmp/fe-p2055/public/index.html

          cat > /tmp/fe-p2055/wrangler.jsonc <<JSON
          {
            "name": "$SERVICE_NAME",
            "compatibility_date": "2026-10-07",
            "assets": { "directory": "./public" }
          }
          JSON

      - name: Non-regression guard for scoring and ranking
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          old=Path('/tmp/fe-evidence/p2054-before.html').read_text(encoding='utf-8')
          new=Path('/tmp/fe-p2055/public/index.html').read_text(encoding='utf-8')

          starts=[
            'function watchThresholds(){',
            'function watchEvaluate(item,s){',
            'function h1WatchThresholds(){',
            'function h1WatchEvaluate(item,s){',
            'function hcEvaluate(item,s){',
            'function feMasterRankRows(rows){',
            'function feMasterRankMeta(row){',
          ]
          def fn_slice(s,start):
            i=s.find(start)
            if i<0: raise SystemExit(f'missing protected function: {start}')
            j=s.find('\n  function ',i+len(start))
            if j<0: raise SystemExit(f'cannot bound protected function: {start}')
            return s[i:j]
          for st in starts:
            a=fn_slice(old,st);b=fn_slice(new,st)
            if a!=b:
              raise SystemExit(f'NON_REGRESSION_FAIL: protected logic changed: {st}')
            print('protected',st,hashlib.sha256(a.encode()).hexdigest()[:16])
          print('SCORING/RANKING NON-REGRESSION PASS')
          PY

      - name: JavaScript syntax and patch-scope checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,difflib
          old=Path('/tmp/fe-evidence/p2054-before.html').read_text(encoding='utf-8')
          new=Path('/tmp/fe-p2055/public/index.html').read_text(encoding='utf-8')
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',new,flags=re.S|re.I):
            if re.search(r'\bsrc\s*=',attrs,re.I): continue
            if re.search(r'application/(?:ld\+)?json',attrs,re.I): continue
            scripts.append(body)
          Path('/tmp/fe-evidence/p2055-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          diff=list(difflib.unified_diff(old.splitlines(),new.splitlines(),n=1))
          Path('/tmp/fe-evidence/p2054-to-p2055.diff').write_text('\n'.join(diff),encoding='utf-8')
          # Scope guard: this patch may only add the marker + FT start acquisition + HC start acquisition/pre-baseline fallback.
          required=['FT_SCREEN_TIMEOUT_40S','HC_SCREEN_TIMEOUT_40S','HC_REFERENCE_TIMEOUT_20S','HC_PRE_TIMEOUT_20S']
          for x in required:
            if x not in new: raise SystemExit('missing '+x)
          print('patch diff lines',len(diff))
          PY
          node --check /tmp/fe-evidence/p2055-inline.js
          echo "P2055 syntax + patch-scope PASS"

      - name: Confirm production is exact P2054 before overwrite
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 5 --retry-delay 2 -H 'Cache-Control: no-cache, no-store' "$SERVICE_URL/?_fe_p2055_pre=$(date +%s%N)" -o /tmp/fe-evidence/live-before.html
          LIVE_BEFORE_SHA="$(sha256sum /tmp/fe-evidence/live-before.html | awk '{print $1}')"
          echo "$LIVE_BEFORE_SHA  live-before/index.html" | tee /tmp/fe-evidence/live-before.sha256
          test "$LIVE_BEFORE_SHA" = "$EXPECTED_P2054_SHA256"
          grep -Fq "$P2054_MARKER" /tmp/fe-evidence/live-before.html

      - name: Deploy P2055 with automatic rollback
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DEPLOYED=0
          EXPECTED_P2055_SHA="$(awk '{print $1}' /tmp/fe-evidence/p2055.sha256)"
          rollback_previous() {
            if [ "$DEPLOYED" = "1" ]; then
              echo "::warning::P2055 smoke failed; rolling back immediately"
              npx wrangler rollback --name "$SERVICE_NAME" --message "Automatic rollback: P2055 FT/HC watchdog failed" | tee /tmp/fe-evidence/rollback.log
            fi
          }

          cd /tmp/fe-p2055
          npx "$GITHUB_WORKSPACE/node_modules/wrangler/bin/wrangler.js" deploy --config wrangler.jsonc --name "$SERVICE_NAME" | tee /tmp/fe-evidence/deploy.log
          DEPLOYED=1
          cd "$GITHUB_WORKSPACE"

          PASS=0
          for i in $(seq 1 40); do
            if curl -fLsS -H 'Cache-Control: no-cache, no-store' "$SERVICE_URL/?_fe_p2055_smoke=$i-$(date +%s%N)" -o /tmp/fe-evidence/live-index.html; then
              LIVE_SHA="$(sha256sum /tmp/fe-evidence/live-index.html | awk '{print $1}')"
              echo "attempt=$i live_sha=$LIVE_SHA expected=$EXPECTED_P2055_SHA"
              if [ "$LIVE_SHA" = "$EXPECTED_P2055_SHA" ] \
                 && grep -Fq "$P2055_MARKER" /tmp/fe-evidence/live-index.html \
                 && grep -Fq 'H1_SCREEN_FIXTURE_TIMEOUT_MS=40000' /tmp/fe-evidence/live-index.html \
                 && grep -Fq 'FT_SCREEN_FIXTURE_TIMEOUT_MS=40000' /tmp/fe-evidence/live-index.html \
                 && grep -Fq 'HC_SCREEN_FIXTURE_TIMEOUT_MS=40000' /tmp/fe-evidence/live-index.html \
                 && grep -Fq '.fmd-card,.mt-intel' /tmp/fe-evidence/live-index.html; then
                PASS=1
                break
              fi
            fi
            sleep 3
          done
          if [ "$PASS" != "1" ]; then
            rollback_previous
            exit 31
          fi
          npx wrangler deployments list --name "$SERVICE_NAME" --json > /tmp/fe-evidence/deployments-after.json
          echo "P2055 production smoke PASS"

      - name: Upload P2055 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-edge-p2055-ft-hc-watchdog-evidence
          path: /tmp/fe-evidence/
          retention-days: 30
