name: FT isolated remote D1 measurement
on:
  push:
    branches: [fix/ft-foundation-20261021]
    paths: ['ft-audit-fix/remote-d1-audit.mjs', '.github/workflows/ft-remote-d1-audit.yml']
permissions: {contents: read}
concurrency:
  group: ft-remote-d1-audit
  cancel-in-progress: false
jobs:
  measure:
    if: contains(github.event.head_commit.message, '[ft-remote-d1-once]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: football-edge-production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Measure synthetic records in one newly created isolated D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ft-audit-fix/remote-d1-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft-remote-d1-audit
          path: ft-audit-output/remote-d1-audit.json
          retention-days: 90
