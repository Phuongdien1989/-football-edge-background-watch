name: FT raw odds presence — one-shot indexed readonly D1
on:
  push:
    branches: [fix/ft-foundation-20261021]
    paths:
      - 'ft-audit-fix/legacy-ft-payload-readonly.mjs'
      - 'ft-audit-fix/legacy-ft-payload-shape.mjs'
      - '.github/workflows/ft-legacy-payload-readonly.yml'
permissions: {contents: read}
concurrency:
  group: ft-raw-payload-presence-once
  cancel-in-progress: false
jobs:
  examine:
    if: contains(github.event.head_commit.message, '[ft-raw-payload-once]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: football-edge-production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test strict SELECT-only odds presence plan
        run: node ft-audit-fix/test-legacy-ft-payload-shape.mjs
      - name: Fresh UTC D1 usage precheck — no SQL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_READ_ONLY_AUDIT_ONCE: CONFIRM
        run: node ft-audit-fix/d1-readonly-analytics.mjs
      - name: Bounded 24 FT raw odds presence flags — SELECT only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FT_RAW_ODDS_SHAPE_ONCE: CONFIRM
        run: node ft-audit-fix/legacy-ft-payload-readonly.mjs
      - name: Save counts only, no raw odds
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft-raw-odds-shape-aggregate-only
          path: |
            ft-audit-output/ft-d1-readonly-usage.json
            ft-audit-output/ft-legacy-payload-shape.json
          retention-days: 30
