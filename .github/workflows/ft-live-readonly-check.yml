name: FT read-only active deployment and rollback one-shot
on:
  push:
    branches: [fix/ft-foundation-20261021]
    paths: ['ft-audit-fix/live-deployment-readonly.mjs','.github/workflows/ft-live-readonly-check.yml']
permissions: {contents: read}
concurrency: {group: ft-live-readonly-check-once, cancel-in-progress: false}
jobs:
  inspect:
    if: contains(github.event.head_commit.message,'[fe-live-readonly-once]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: football-edge-production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read Cloudflare versions, health, rollback only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FT_LIVE_VERSION_AUDIT: READ_ONLY_ONCE
        run: node ft-audit-fix/live-deployment-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ft-live-readonly-deployment, path: ft-audit-output/ft-live-deployment-readonly.json, retention-days: 30}
