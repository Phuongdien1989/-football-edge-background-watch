name: Football Edge Android FCM Runtime Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'worker_notify_v132_native.js'
      - '.github/workflows/android-fcm-runtime-test.yml'

permissions:
  contents: read

jobs:
  android-fcm-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
      FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare native web baseline
        shell: bash
        run: |
          set -euo pipefail
          cd native
          mkdir -p www
          FRONTEND='https://shiny-silence-d892.ngophuonghuy.workers.dev'
          curl -fsSL --retry 3 "$FRONTEND/" -o www/index.html
          curl -fsSL --retry 3 "$FRONTEND/push-sw.js" -o www/push-sw.js
          echo '16fe0c6ef7b753af1fd62d8378dc9ba934f0f88baeac2835bdf7633d5571396c  www/index.html' | sha256sum -c -
          echo '8909f051ddaae2660ccda8cd32663af1c279b2b7b38d4f0ce4af34d3df4210eb  www/push-sw.js' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./native-shell.css">'
          js='<script src="./native-shell.js"></script>'
          if css not in s: s=s.replace('</head>',css+'\n</head>',1)
          if js not in s: s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Static syntax checks
        run: |
          node --check native/www/native-shell.js
          node --check worker_notify_v132_native.js

      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install

      - name: Generate Android project
        working-directory: native
        run: npx cap add android

      - name: Inject and verify Firebase client config
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_GOOGLE_SERVICES_JSON:-}" || { echo 'FIREBASE_GOOGLE_SERVICES_JSON secret is required'; exit 1; }
          TARGET='native/android/app/google-services.json'
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > "$TARGET"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('native/android/app/google-services.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          packages=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in data.get('client',[])]
          expected='vn.footballedge.app'
          if expected not in packages:
              raise SystemExit(f'Expected package {expected}; found {packages}')
          print('Firebase client config PASS for', expected)
          PY

      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync android

      - name: Add CI-only FCM token probe
        shell: bash
        run: |
          set -euo pipefail
          MAIN=$(find native/android/app/src/main -type f \( -name 'MainActivity.java' -o -name 'MainActivity.kt' \) | head -n1)
          test -n "$MAIN" || { echo 'MainActivity not found'; exit 1; }
          echo "Patching CI-only token probe in $MAIN"
          if [[ "$MAIN" == *.java ]]; then
            cat > "$MAIN" <<'JAVA'
          package vn.footballedge.app;

          import android.os.Bundle;
          import android.util.Log;
          import com.getcapacitor.BridgeActivity;
          import com.google.firebase.messaging.FirebaseMessaging;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              FirebaseMessaging.getInstance().getToken().addOnCompleteListener(task -> {
                if (!task.isSuccessful()) {
                  Log.e("FE_FCM_TEST", "TOKEN_ERROR", task.getException());
                  return;
                }
                String token = task.getResult();
                Log.i("FE_FCM_TEST", "TOKEN=" + token);
              });
            }
          }
          JAVA
          else
            echo 'Kotlin MainActivity is not expected in this Capacitor template.'
            exit 1
          fi

          # The Capacitor Push plugin already depends on firebase-messaging, but its
          # implementation dependency is not guaranteed to be on the app compile classpath.
          APP_GRADLE='native/android/app/build.gradle'
          if ! grep -q 'firebase-messaging' "$APP_GRADLE"; then
            python - <<'PY'
          from pathlib import Path
          p=Path('native/android/app/build.gradle')
          s=p.read_text()
          marker='dependencies {'
          if marker not in s: raise SystemExit('dependencies block not found')
          s=s.replace(marker, marker+'\n    implementation "com.google.firebase:firebase-messaging:24.1.2"',1)
          p.write_text(s)
          PY
          fi

      - name: Build debug APK with FCM probe
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Run emulator and verify FCM runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK='native/android/app/build/outputs/apk/debug/app-debug.apk'
            adb install -r "$APK"
            adb shell pm grant vn.footballedge.app android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell am force-stop vn.footballedge.app
            adb shell am start -n vn.footballedge.app/.MainActivity

            TOKEN=''
            for i in $(seq 1 40); do
              LINE=$(adb logcat -d -s FE_FCM_TEST:I '*:S' | grep 'TOKEN=' | tail -n1 || true)
              if [ -n "$LINE" ]; then
                TOKEN=${LINE#*TOKEN=}
                TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n ')
                break
              fi
              sleep 2
            done
            if [ -z "$TOKEN" ]; then
              echo 'FCM token was not generated.'
              adb logcat -d -s FE_FCM_TEST:I '*:S' || true
              exit 1
            fi
            echo "::add-mask::$TOKEN"
            TOKEN_HASH=$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')
            echo "FCM token generation PASS • length=${#TOKEN} • sha256=${TOKEN_HASH:0:16}…"
            printf '%s' "$TOKEN" > /tmp/fe_fcm_token

            if [ -z "${FCM_SERVICE_ACCOUNT_JSON:-}" ]; then
              echo 'FCM direct-send phase SKIPPED: GitHub secret FCM_SERVICE_ACCOUNT_JSON is not configured yet.'
              printf 'TOKEN_GENERATION=PASS\nFCM_SEND=SKIPPED\nNOTIFICATION_RECEIPT=SKIPPED\n' > /tmp/fcm-runtime-report.txt
              exit 0
            fi

            # Keep app in background so a notification payload is rendered by Android System UI.
            adb shell input keyevent KEYCODE_HOME

            export FCM_DEVICE_TOKEN="$TOKEN"
            node <<'NODE'
            const crypto=require('crypto');
            const sa=JSON.parse(process.env.FCM_SERVICE_ACCOUNT_JSON);
            const b64=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
            const now=Math.floor(Date.now()/1000);
            const input=b64({alg:'RS256',typ:'JWT'})+'.'+b64({iss:sa.client_email,scope:'https://www.googleapis.com/auth/firebase.messaging',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+3600});
            const sig=crypto.sign('RSA-SHA256',Buffer.from(input),sa.private_key).toString('base64url');
            const assertion=input+'.'+sig;
            (async()=>{
              const t=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion})});
              const tj=await t.json();
              if(!t.ok||!tj.access_token) throw new Error('OAuth failed '+t.status+' '+JSON.stringify(tj));
              const title='Football Edge CI Native Push';
              const body='FCM runtime end-to-end test';
              const r=await fetch(`https://fcm.googleapis.com/v1/projects/${encodeURIComponent(sa.project_id)}/messages:send`,{method:'POST',headers:{authorization:'Bearer '+tj.access_token,'content-type':'application/json'},body:JSON.stringify({message:{token:process.env.FCM_DEVICE_TOKEN,notification:{title,body},data:{tag:'fe-ci-fcm-runtime',fe_mode:'FT',fixture_id:'0'}}})});
              const raw=await r.text();
              if(!r.ok) throw new Error('FCM send failed '+r.status+' '+raw.slice(0,300));
              console.log('FCM HTTP v1 send PASS');
            })().catch(e=>{console.error(e);process.exit(1)});
            NODE

            RECEIVED=0
            for i in $(seq 1 20); do
              if adb shell dumpsys notification --noredact | grep -q 'Football Edge CI Native Push'; then
                RECEIVED=1
                break
              fi
              sleep 2
            done
            if [ "$RECEIVED" != '1' ]; then
              echo 'FCM send succeeded but Android notification was not observed.'
              adb shell dumpsys notification --noredact | tail -n 240 || true
              exit 1
            fi
            echo 'Android notification receipt PASS'
            printf 'TOKEN_GENERATION=PASS\nFCM_SEND=PASS\nNOTIFICATION_RECEIPT=PASS\n' > /tmp/fcm-runtime-report.txt

      - name: Upload runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-edge-fcm-runtime-report
          path: /tmp/fcm-runtime-report.txt
          if-no-files-found: warn
          retention-days: 7
