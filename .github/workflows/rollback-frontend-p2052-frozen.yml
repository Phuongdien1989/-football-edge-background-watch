name: Rollback Frontend to Frozen P2052

on:
  push:
    branches:
      - rollback/frontend-p2052-frozen-20261007
    paths:
      - ".github/workflows/rollback-frontend-p2052-frozen.yml"
  workflow_dispatch:

concurrency:
  group: football-edge-frontend-frozen-p2052-rollback
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVICE_NAME: shiny-silence-d892
      SERVICE_URL: https://shiny-silence-d892.ngophuonghuy.workers.dev
      BASE_ARTIFACT_RUN_ID: "36998717198"
      BASE_ARTIFACT_NAME: FOOTBALL_EDGE_CURRENT_SOURCE_SANITIZED_2026-10-02
      EXPECTED_BASE_SHA256: f2d5c471c247ed77b07e3cb9096e5c04ae9c69b4d8af1b25a4fbe7ca955bfb5c
      EXPECTED_P2052_SHA256: a82bf87e1db875fb975b94ac9b6df9e785818de37b7bb55fec6f290efca9c844
      P2052_MARKER: FE P2.0.5.2 LIVE SCAN / API STATUS / SCAN-CONTROL HOTFIX 2026-10-03

    steps:
      - uses: actions/checkout@v4

      - name: Guard exact rollback target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "rollback/frontend-p2052-frozen-20261007"
          test "$SERVICE_NAME" = "shiny-silence-d892"
          echo "Frozen P2052 rollback guard PASS"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install pinned Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4.119.0

      - name: Download frozen source artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT_NAME }}
          path: /tmp/fe-base-artifact
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_ARTIFACT_RUN_ID }}

      - name: Reconstruct exact frozen P2052
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fe-source /tmp/fe-p2052/public /tmp/fe-evidence
          INNER="$(find /tmp/fe-base-artifact -type f -name '*.zip' -print -quit)"
          test -n "$INNER"
          unzip -q "$INNER" -d /tmp/fe-source
          BASE="$(find /tmp/fe-source -type f -path '*/frontend/index.html' -print -quit)"
          test -f "$BASE"
          BASE_SHA="$(sha256sum "$BASE" | awk '{print $1}')"
          test "$BASE_SHA" = "$EXPECTED_BASE_SHA256"

          cp "$BASE" /tmp/fe-p2052/public/index.html
          patch -p1 -d /tmp/fe-p2052/public < "$GITHUB_WORKSPACE/.deploy/p2052/site.patch"

          P2052_SHA="$(sha256sum /tmp/fe-p2052/public/index.html | awk '{print $1}')"
          echo "$P2052_SHA  P2052/index.html" | tee /tmp/fe-evidence/p2052.sha256
          test "$P2052_SHA" = "$EXPECTED_P2052_SHA256"
          grep -Fq "$P2052_MARKER" /tmp/fe-p2052/public/index.html

          curl -fLsS --retry 5 --retry-delay 2 -H 'Cache-Control: no-cache, no-store' "$SERVICE_URL/?_before_frozen_rollback=$(date +%s%N)" -o /tmp/fe-evidence/live-before.html
          sha256sum /tmp/fe-evidence/live-before.html | tee /tmp/fe-evidence/live-before.sha256

          cat > /tmp/fe-p2052/wrangler.jsonc <<JSON
          {
            "name": "$SERVICE_NAME",
            "compatibility_date": "2026-10-07",
            "assets": { "directory": "./public" }
          }
          JSON

      - name: Deploy exact frozen P2052
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd /tmp/fe-p2052
          npx "$GITHUB_WORKSPACE/node_modules/wrangler/bin/wrangler.js" deploy --config wrangler.jsonc --name "$SERVICE_NAME" | tee /tmp/fe-evidence/deploy.log
          cd "$GITHUB_WORKSPACE"

          PASS=0
          for i in $(seq 1 40); do
            if curl -fLsS -H 'Cache-Control: no-cache, no-store' "$SERVICE_URL/?_frozen_p2052=$i-$(date +%s%N)" -o /tmp/fe-evidence/live-index.html; then
              LIVE_SHA="$(sha256sum /tmp/fe-evidence/live-index.html | awk '{print $1}')"
              echo "attempt=$i live_sha=$LIVE_SHA expected=$EXPECTED_P2052_SHA256"
              if [ "$LIVE_SHA" = "$EXPECTED_P2052_SHA256" ] && grep -Fq "$P2052_MARKER" /tmp/fe-evidence/live-index.html; then
                PASS=1
                break
              fi
            fi
            sleep 3
          done
          test "$PASS" = "1"
          npx wrangler deployments list --name "$SERVICE_NAME" --json > /tmp/fe-evidence/deployments-after.json
          echo "Frozen P2052 restore PASS"

      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-edge-frozen-p2052-rollback-evidence
          path: /tmp/fe-evidence/
          retention-days: 30
