name: Deploy P2053 Scan Diagnostic Staging

on:
  push:
    branches:
      - work/p2053-scan-diagnostic-20261007
    paths:
      - ".github/workflows/deploy-p2053-scan-diagnostic.yml"
      - ".deploy/diag-p2053/patch-scan-diagnostic.py"
  workflow_dispatch:

concurrency:
  group: football-edge-p2053-scan-diagnostic
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy P2053 diagnostic staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVICE_NAME: football-edge-scan-diagnostic
      SERVICE_URL: https://football-edge-scan-diagnostic.ngophuonghuy.workers.dev
      BASE_ARTIFACT_RUN_ID: "36998717198"
      BASE_ARTIFACT_NAME: FOOTBALL_EDGE_CURRENT_SOURCE_SANITIZED_2026-10-02
      EXPECTED_BASE_SHA256: f2d5c471c247ed77b07e3cb9096e5c04ae9c69b4d8af1b25a4fbe7ca955bfb5c
      EXPECTED_P2052_SHA256: a82bf87e1db875fb975b94ac9b6df9e785818de37b7bb55fec6f290efca9c844
      EXPECTED_P2053_SHA256: ab02d1eb428048bd00a69f56c3e5a16bed3c107feb66110c3ab08a9e84a05069
      DIAG_MARKER: FE P2053 SCAN DIAGNOSTIC STAGING 2026-10-07

    steps:
      - uses: actions/checkout@v4

      - name: Guard staging target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/p2053-scan-diagnostic-20261007"
          test "$SERVICE_NAME" = "football-edge-scan-diagnostic"
          test "$SERVICE_NAME" != "shiny-silence-d892"
          test "$SERVICE_NAME" != "football-edge-background-watch"
          echo "Diagnostic staging guard PASS"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install pinned Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4.119.0

      - name: Download frozen frontend baseline
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT_NAME }}
          path: /tmp/fe-base-artifact
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_ARTIFACT_RUN_ID }}

      - name: Rebuild exact P2053 and add diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fe-source /tmp/fe-diag/public /tmp/fe-evidence
          INNER="$(find /tmp/fe-base-artifact -type f -name '*.zip' -print -quit)"
          test -n "$INNER"
          unzip -q "$INNER" -d /tmp/fe-source
          BASE="$(find /tmp/fe-source -type f -path '*/frontend/index.html' -print -quit)"
          test -f "$BASE"
          test "$(sha256sum "$BASE" | awk '{print $1}')" = "$EXPECTED_BASE_SHA256"

          cp "$BASE" /tmp/fe-diag/public/index.html
          patch -p1 -d /tmp/fe-diag/public < "$GITHUB_WORKSPACE/.deploy/p2052/site.patch"
          test "$(sha256sum /tmp/fe-diag/public/index.html | awk '{print $1}')" = "$EXPECTED_P2052_SHA256"

          python "$GITHUB_WORKSPACE/.deploy/p2053/patch-hide-research.py" /tmp/fe-diag/public/index.html
          test "$(sha256sum /tmp/fe-diag/public/index.html | awk '{print $1}')" = "$EXPECTED_P2053_SHA256"
          cp /tmp/fe-diag/public/index.html /tmp/fe-evidence/p2053-before.html

          python "$GITHUB_WORKSPACE/.deploy/diag-p2053/patch-scan-diagnostic.py" /tmp/fe-diag/public/index.html | tee /tmp/fe-evidence/diag-build-sha.txt
          DIAG_SHA="$(sha256sum /tmp/fe-diag/public/index.html | awk '{print $1}')"
          echo "$DIAG_SHA  diagnostic/index.html" | tee /tmp/fe-evidence/diagnostic.sha256

          grep -Fq "$DIAG_MARKER" /tmp/fe-diag/public/index.html
          grep -Fq 'feScanDiagPanel' /tmp/fe-diag/public/index.html
          grep -Fq 'window.FE_SCAN_DIAG' /tmp/fe-diag/public/index.html
          grep -Fq '.fmd-card,.mt-intel' /tmp/fe-diag/public/index.html

          cat > /tmp/fe-diag/wrangler.jsonc <<JSON
          {
            "name": "$SERVICE_NAME",
            "compatibility_date": "2026-10-07",
            "assets": { "directory": "./public" }
          }
          JSON

      - name: Protected scoring/ranking non-regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          old=Path('/tmp/fe-evidence/p2053-before.html').read_text(encoding='utf-8')
          new=Path('/tmp/fe-diag/public/index.html').read_text(encoding='utf-8')
          starts=[
            'function watchThresholds(){',
            'function watchEvaluate(item,s){',
            'function h1WatchThresholds(){',
            'function h1WatchEvaluate(item,s){',
            'function hcEvaluate(item,s){',
            'function feMasterRankRows(rows){',
            'function feMasterRankMeta(x){',
          ]
          def fn_slice(s,start):
            i=s.find(start)
            if i<0: raise SystemExit(f'missing protected function: {start}')
            j=s.find('\n  function ',i+len(start))
            if j<0: j=s.find('\n  async function ',i+len(start))
            if j<0: raise SystemExit(f'cannot bound protected function: {start}')
            return s[i:j]
          for st in starts:
            a=fn_slice(old,st);b=fn_slice(new,st)
            if a!=b: raise SystemExit(f'NON_REGRESSION_FAIL: {st}')
            print('protected',st,hashlib.sha256(a.encode()).hexdigest()[:16])
          print('DIAGNOSTIC SCORING/RANKING NON-REGRESSION PASS')
          PY

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/fe-diag/public/index.html').read_text(encoding='utf-8')
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,flags=re.S|re.I):
            if re.search(r'\bsrc\s*=',attrs,re.I): continue
            if re.search(r'application/(?:ld\+)?json',attrs,re.I): continue
            scripts.append(body)
          Path('/tmp/fe-evidence/diagnostic-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/fe-evidence/diagnostic-inline.js
          echo "Diagnostic JavaScript syntax PASS"

      - name: Deploy diagnostic staging only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          EXPECTED_DIAG_SHA="$(awk '{print $1}' /tmp/fe-evidence/diagnostic.sha256)"
          cd /tmp/fe-diag
          npx "$GITHUB_WORKSPACE/node_modules/wrangler/bin/wrangler.js" deploy --config wrangler.jsonc --name "$SERVICE_NAME" | tee /tmp/fe-evidence/deploy.log
          cd "$GITHUB_WORKSPACE"

          PASS=0
          for i in $(seq 1 40); do
            if curl -fLsS -H 'Cache-Control: no-cache, no-store' "$SERVICE_URL/?_diag=$i-$(date +%s%N)" -o /tmp/fe-evidence/live-index.html; then
              LIVE_SHA="$(sha256sum /tmp/fe-evidence/live-index.html | awk '{print $1}')"
              echo "attempt=$i live_sha=$LIVE_SHA expected=$EXPECTED_DIAG_SHA"
              if [ "$LIVE_SHA" = "$EXPECTED_DIAG_SHA" ] \
                 && grep -Fq "$DIAG_MARKER" /tmp/fe-evidence/live-index.html \
                 && grep -Fq 'feScanDiagPanel' /tmp/fe-evidence/live-index.html \
                 && grep -Fq 'window.FE_SCAN_DIAG' /tmp/fe-evidence/live-index.html; then
                PASS=1
                break
              fi
            fi
            sleep 3
          done
          test "$PASS" = "1"
          echo "P2053 diagnostic staging smoke PASS"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-edge-p2053-scan-diagnostic-evidence
          path: /tmp/fe-evidence/
          retention-days: 30
