name: HC step 1-2 exact quote contract and source isolation
on:
  push:
    branches: [fix/hc-exact-quote-contracts-20261026]
    paths: ['hc-contracts-release/**', 'hc-contracts/**', 'ft-overview/build-integration.mjs', '.github/workflows/hc-contracts-release.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: fe-football-edge-mobile-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: football-edge-production
    env: {WRANGLER_SEND_METRICS: 'false'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: ht-quote-retention-release-proof
          run-id: 40253774807
          github-token: ${{ github.token }}
          path: previous-mobile
      - name: Regression and exact settlement, independent price, session state tests
        run: |
          node --check hc-contracts/runtime.js
          node hc-contracts/test.mjs
          node ft-overview/build-integration.mjs ft-overview/frozen-original-mobile.html
          node --check ht-early-candidate/ui.mjs
          node ht-early-candidate/test-model.mjs
          node ht-early-candidate/test-valuation.mjs
          node ht-early-candidate/test-session.mjs
          node ft-overview/test.mjs
          node ft-overview/test-experimental-decision.mjs
          node ft-overview/test-light-signal-pro-view.mjs
          node ft-overview/test-live-probability.mjs
          node ft-overview/test-valuation-session.mjs
          node ft-overview/test-ft-state-model.mjs
          node ft-overview/test-tab-performance.mjs
          node --check ft-overview/ft-ai-v2-integrated.mjs
          node --check hc-contracts-release/release.mjs
          node --check hc-contracts-release/test-browser.cjs
      - run: npm install --no-save --no-package-lock wrangler@4 playwright@1.58.2
      - name: Verify current versions and back up all 36 public assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node hc-contracts-release/release.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: pre-hc-contracts-mobile-backup
          path: |
            hc-contracts-package/backup/
            hc-contracts-package/backup-version.json
            hc-contracts-package/manifest.json
          retention-days: 90
      - name: Exact HC contracts and unrelated-script scope
        run: node hc-contracts/test.mjs hc-contracts-package/backup/index.html
      - name: Candidate actual navigation and HT isolation at four widths
        run: node hc-contracts-release/test-browser.cjs --candidate
      - run: npx wrangler deploy --dry-run --config hc-contracts-package/wrangler.json
      - name: Deploy scoped HC inline repair in complete static bundle
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node hc-contracts-release/release.mjs deploy
      - name: Published app navigation, FT session, goal invalidation and HT isolation
        run: node hc-contracts-release/test-browser.cjs
      - name: Verify public hashes, backend, Desktop and scanner unchanged
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node hc-contracts-release/release.mjs verify
      - name: Roll back Mobile if post-deploy acceptance fails
        if: failure() && steps.publish.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node hc-contracts-release/release.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hc-exact-quote-release-proof
          path: hc-contracts-package/
          retention-days: 90

