name: Verified TOP watch ranking without signal promotion
on:
  push:
    branches: [fix/production-notification-sync-20261009]
    paths: ['.github/workflows/deploy-top.yml']
concurrency:
  group: football-edge-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y xvfb webkit2gtk-driver
      - run: node sync-fix/build.cjs
      - run: node sync-fix/tests/test-top.cjs
      - run: node --experimental-vm-modules sync-fix/tests/test-worker.mjs
      - run: python3 sync-fix/tests/test-browser.py
  deploy:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y xvfb webkit2gtk-driver
      - run: npm install --no-save --no-audit --no-fund wrangler@4.119.0
      - run: node sync-fix/build.cjs
      - name: Preserve pre-hide release, deploy frontend only, verify real sync LIVE and TOP or rollback
        run: node sync-fix/deploy-top.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKGROUND_TOKEN: ${{ secrets.BACKGROUND_TOKEN }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fe-top-watch-verification-and-exact-rollback
          path: |
            sync-fix/evidence-top/
            sync-fix/SOURCE_LOCK.json
          retention-days: 90
