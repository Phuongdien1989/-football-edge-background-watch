name: B05A QA33 Read-only Evidence Audit
on:
  push:
    branches: [offline/qa33-eligibility-wait-20261008]
    paths: [.github/workflows/b05a-qa33-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore locked code only
        shell: bash
        run: |
          set -euo pipefail
          echo '68f2a8a9b0233a9fcf4cba9c53961ca9dd9dd06deeb533f8f78fe74c9ed0f03f  FOOTBALL_EDGE_FINAL_PRESTAGING_FIXED_SHA68F2.zip' | sha256sum -c -
          unzip -q FOOTBALL_EDGE_FINAL_PRESTAGING_FIXED_SHA68F2.zip -d _audit
          ROOT="$(find _audit -name START_HERE_FINAL_FIXED.md -printf '%h\n' -quit)"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          mkdir -p evidence-audit
      - name: Read-only budget, session and capture audit (no provider)
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          node --input-type=module <<'NODE' | tee "$GITHUB_WORKSPACE/evidence-audit/AUDIT.json"
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {createNodeHttpD1BridgeA3} from './staging_kit/batch05a3-http-d1-bridge.js';
          import {assertCaptureContent} from './prediction_v2/capture-integrity.js';
          const token=crypto.createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('FOOTBALL_EDGE_B05A_BRIDGE_V1').digest('hex');
          console.log('::add-mask::'+token);
          const b=createNodeHttpD1BridgeA3({baseUrl:'https://football-edge-b05a-staging-bridge.ngophuonghuy.workers.dev',token,pilotId:'FE-B05A-ELIGIBLE-PILOT-01',ownerId:'qa33-read-only-auditor'});
          const before=await b.budgetStore.load(),session=await b.sessionStore.load(),evidence=await b.exportEvidence();
          const captures=evidence.captures||[];
          for(const c of captures)await assertCaptureContent(c);
          const discoveries=captures.filter(c=>c.endpoint==='/fixtures').map(c=>({record_id:c.record_id,capture_status:c.capture_status,http_status:c.http_status,received_at:c.received_at,errors:c.payload?.errors,response:c.payload?.response}));
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/evidence-audit/EXPORT.json',JSON.stringify(evidence,null,2));
          const after=await b.budgetStore.load();
          if(JSON.stringify(before)!==JSON.stringify(after))throw Error('BUDGET_CHANGED_DURING_AUDIT');
          if(before?.total_requests!==2||!before?.stop_reason)throw Error('EXPECTED_STOPPED_TWO_ATTEMPTS_STATE_CHANGED');
          const p=await fetch('https://shiny-silence-d892.ngophuonghuy.workers.dev');if(!p.ok)throw Error('PRODUCTION_READ_FAILED');
          const sha=crypto.createHash('sha256').update(Buffer.from(await p.arrayBuffer())).digest('hex');
          if(sha!=='a82bf87e1db875fb975b94ac9b6df9e785818de37b7bb55fec6f290efca9c844')throw Error('PRODUCTION_FROZEN_HASH_MISMATCH');
          console.log(JSON.stringify({pilot_id:before.pilot_id,provider_attempts:before.total_requests,budget_stop:before.stop_reason,session_stop:session?.stop_reason,captures:captures.length,raw_integrity:'PASS',observations:evidence.locked_observations?.length,old_outputs:evidence.old_exact_outputs?.length,discoveries,production_sha256:sha,audit_provider_calls:0,audit_mutations:0},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa33-read-only-audit
          path: evidence-audit/
          if-no-files-found: error
