name: Football Edge OPEN settlement reconciliation READ ONLY
on:
  push:
    branches: [diag/result-performance-readonly-20261018]
    paths: ['.github/workflows/result-performance-readonly.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: football-edge-production
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read aggregate results only; no deploy, scanner or provider calls
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/settlement-reconcile-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-edge-settlement-reconciliation
          path: football-edge-reconciliation-*.json
