name: Read-only prediction accuracy and evidence audit
on:
  push:
    branches: [fix/production-notification-sync-20261009]
    paths: ['.github/workflows/audit-accuracy.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read existing predictions, outcomes and evidence only
        run: node sync-fix/audit-accuracy.mjs
        env:
          BACKGROUND_TOKEN: ${{ secrets.BACKGROUND_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fe-read-only-accuracy-audit-20261010
          path: accuracy-audit-20261010/
          retention-days: 90
