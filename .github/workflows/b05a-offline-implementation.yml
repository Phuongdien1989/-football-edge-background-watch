name: B05A Offline Implementation Validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - name: Full offline suite
        run: |
          set -euo pipefail
          for f in prediction_v2/test-*.mjs; do node "$f"; done
          node --check staging_kit/fixture-selector-runtime.js
          node --check staging_kit/b05a-eligible-pilot-entrypoint.mjs
