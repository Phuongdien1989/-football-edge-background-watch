name: Read saved provider error detail with guarded backend rollout
on:
  push:
    branches: [diag/provider-error-detail-20261018]
    paths: ['.github/workflows/provider-detail-release.yml']
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: football-edge-production
    concurrency:
      group: football-edge-backend-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test-provider-diagnostic-detail.mjs
      - run: npm install --no-save wrangler@4
      - name: Preserve configuration, deploy detail-only field, read saved evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/provider-detail-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-detail-sanitized-result
          path: provider-detail-release-result.json
          if-no-files-found: ignore
