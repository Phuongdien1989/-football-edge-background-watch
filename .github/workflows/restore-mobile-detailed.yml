name: Restore original detailed Mobile UI — preserve Premium TOP five
on:
  push:
    branches: [feature/mobile-sports-premium-preview-20261016]
    paths: ['.github/workflows/restore-mobile-detailed.yml']
jobs:
  restore-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: football-edge-production
    concurrency:
      group: football-edge-mobile-premium-release
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve current UI and restore exact original detailed Mobile version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/restore-mobile-detailed.mjs
      - name: Preserve restoration and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-detailed-restored-premium-preserved
          path: mobile-restore-evidence/
          if-no-files-found: warn
