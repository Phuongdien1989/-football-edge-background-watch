name: FT Pilot Gate A verified account budget — READ ONLY
on:
  push:
    branches: [fix/ft-foundation-20261021]
    paths:
      - '.github/workflows/ft-pilot-gate-a-readonly.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ft-pilot-gate-a-preflight-once
  cancel-in-progress: false
jobs:
  verify_cloudflare_account:
    if: contains(github.event.head_commit.message, '[gate-a-preflight-once]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: football-edge-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloudflare GET D1 inventory plus read-only GraphQL analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_READ_ONLY_AUDIT_ONCE: CONFIRM
        run: node ft-audit-fix/d1-readonly-analytics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft-gate-a-account-readonly-NO-DEPLOY
          path: ft-audit-output/ft-d1-readonly-usage.json
          retention-days: 60
