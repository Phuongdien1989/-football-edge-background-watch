name: FT pair isolated D1 one-shot verification
on:
  push:
    branches: [fix/ft-foundation-20261021]
    paths:
      - 'ft-audit-fix/remote-pair-d1-audit.mjs'
      - '.github/workflows/ft-remote-pair-d1.yml'
permissions: {contents: read}
concurrency:
  group: ft-pair-remote-d1-once
  cancel-in-progress: false
jobs:
  measure_pair:
    if: contains(github.event.head_commit.message, '[ft-pair-remote-once]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: football-edge-production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Measure ONLY pinned isolated test D1 UUID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FT_PAIR_REMOTE_ONCE: CONFIRM_ISOLATED
        run: node ft-audit-fix/remote-pair-d1-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft-pair-isolated-d1-measurement
          path: ft-audit-output/remote-pair-d1-measurement.json
          retention-days: 90
