name: PR7 production-only D1 meter checks (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'worker_notify_v138_peak_window.js'
      - 'd1-production-meter.mjs'
      - 'tests/test-d1-production-meter.mjs'
      - '.github/workflows/d1-meter-diff-regression.yml'
jobs:
  instrumentation-only:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'diag/d1-production-meter-only-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard production parent and instrumentation-only scope
        run: |
          test "$(git rev-parse diag/d1-prod-baseline-20261014 2>/dev/null || git rev-parse 6b7accb869cf64598b7ca39d5326d6b4080313e1)" = '6b7accb869cf64598b7ca39d5326d6b4080313e1'
          python3 - <<'PY'
          import subprocess,difflib,pathlib
          base='6b7accb869cf64598b7ca39d5326d6b4080313e1'
          path='worker_notify_v138_peak_window.js'
          old=subprocess.check_output(['git','show',base+':'+path],text=True)
          new=pathlib.Path(path).read_text()
          expected=old.replace("import {providerRateScope} from './provider_errors.mjs';","import {providerRateScope} from './provider_errors.mjs';\nimport {instrumentD1Env} from './d1-production-meter.mjs';")
          expected=expected.replace('    super(ctx,env);',\"    super(ctx,instrumentD1Env(env,'DURABLE_OBJECT'));\")
          expected=expected.replace('  const response=await base.fetch(request,env,ctx);',\"  const response=await base.fetch(request,instrumentD1Env(env,'EDGE_WORKER'),ctx);\")
          assert new==expected,'production entrypoint includes unapproved non-meter changes'
          names=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          approved={'worker_notify_v138_peak_window.js','d1-production-meter.mjs','tests/test-d1-production-meter.mjs','tests/test-do-free-peak-window.mjs','.github/scripts/d1-meter-readonly-preflight.mjs','.github/workflows/d1-meter-readonly-preflight.yml','.github/workflows/d1-meter-diff-regression.yml'}
          assert set(names)<=approved, 'unexpected source modified: '+repr(set(names)-approved)
          cfg=pathlib.Path('wrangler.toml').read_text()
          assert 'PEAK_SCAN_ENABLED = "false"' in cfg and 'MANUAL_SCAN_MODE_ENABLED = "true"' in cfg
          assert 'crons = []' in cfg and 'LIVE_STATE_D1_ENABLED = "true"' in cfg
          print('PASS: exact deployed source parent, allowed 3 entrypoint hooks, Free manual-scan settings unchanged')
          PY
      - name: Meter runtime/secret-leak check
        run: |
          node --check d1-production-meter.mjs
          node --check worker_notify_v138_peak_window.js
          node tests/test-d1-production-meter.mjs
      - name: Wrangler bundle ONLY -- no deployment
        run: |
          npm install --no-save wrangler@4
          npx wrangler deploy --dry-run --outdir /tmp/fe-pr7-meter-bundle
