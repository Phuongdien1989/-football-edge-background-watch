name: FT pricing patch — owner authorized same-app release
on:
  push:
    branches: [fix/ft-pricing-evidence-20261024]
    paths:
      - 'ft-overview/release-pricing-patch.mjs'
      - '.github/workflows/ft-pricing-patch-release.yml'
permissions: {contents: read}
concurrency:
  group: football-edge-mobile-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: football-edge-production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node ft-overview/test-experimental-decision.mjs
          node ft-overview/test-decision-evidence.mjs
          node ft-overview/test-same-app-integration.mjs
          node ft-overview/test.mjs
          node --check ft-overview/ft-ai-v2-integrated.mjs
          node --check ft-overview/release-pricing-patch.mjs
      - name: Preserve current 33 assets, replace only two FT modules, deploy and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FT_V2_PRICING_PATCH_RELEASE: APPROVED_20261024
          FT_V2_COMPLETE_MANIFEST_VERIFIED: RECOVERY_28_PLUS_V2_5_VERIFIED_20261024
        run: node ft-overview/release-pricing-patch.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft-pricing-patch-backup-and-proof
          path: ft-overview/pricing-patch-package/
