name: FT D1 Free read-only usage check
on:
  push:
    branches: [fix/ft-foundation-20261021]
    paths:
      - 'ft-audit-fix/d1-readonly-analytics.mjs'
      - '.github/workflows/ft-d1-readonly-usage.yml'
permissions: {contents: read}
concurrency:
  group: ft-d1-free-readonly-once
  cancel-in-progress: false
jobs:
  audit_usage:
    if: contains(github.event.head_commit.message, '[ft-d1-readonly-once]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: football-edge-production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect Cloudflare D1 metrics WITHOUT querying or writing D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_READ_ONLY_AUDIT_ONCE: CONFIRM
        run: node ft-audit-fix/d1-readonly-analytics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft-d1-readonly-usage
          path: ft-audit-output/ft-d1-readonly-usage.json
          retention-days: 30
