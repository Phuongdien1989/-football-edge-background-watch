name: PRE-MATCH — bounded real provider proof
on:
  push:
    branches: [diag/prematch-source-proof-20261031]
    paths: ['prematch-scan/provider-proof.mjs', '.github/workflows/prematch-scan-source-proof.yml']
permissions: {contents: read}
concurrency: {group: fe-prematch-source-proof, cancel-in-progress: false}
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: football-edge-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node prematch-scan/provider-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prematch-real-source-proof
          path: prematch-scan/proof/
          retention-days: 90
