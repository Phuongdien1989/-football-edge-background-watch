name = "football-edge-v2-raw-capture"
main = "worker.js"
compatibility_date = "2026-10-02"

[vars]
CAPTURE_ENABLED = "true"
API_SHARED_RESERVE = "10000"
LEGACY_DAILY_BUDGET = "50000"
COLLECTOR_DAILY_BUDGET_MAX = "12000"
CAPTURE_MAX_REQUESTS_PER_CYCLE = "8"
EVIDENCE_FIXTURES_PER_CYCLE = "3"
CAPTURE_JITTER_MS = "9000"
DETAIL_SPACING_MS = "1500"
RATE_BACKOFF_MS = "120000"
QUOTA_PROBE_MINUTES = "30"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "football-edge-v2-raw"
database_id = "__D1_DATABASE_ID__"

[observability]
enabled = true
head_sampling_rate = 1
