name = "football-edge-v2-raw-capture"
main = "worker.js"
compatibility_date = "2026-10-02"

[vars]
CAPTURE_ENABLED = "true"
API_SHARED_RESERVE = "10000"
LEGACY_DAILY_BUDGET = "50000"
COLLECTOR_DAILY_BUDGET_MAX = "12000"
CAPTURE_MAX_REQUESTS_PER_CYCLE = "3"
EVIDENCE_FIXTURES_PER_CYCLE = "1"
CAPTURE_JITTER_MS = "18000"
CAPTURE_INTERVAL_MS = "60000"
PRE_CAPTURE_INTERVAL_MS = "1800000"
PRE_JITTER_MS = "24000"
DETAIL_SPACING_MS = "6500"
RATE_BACKOFF_MS = "300000"
QUOTA_PROBE_MINUTES = "10"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "football-edge-v2-raw"
database_id = "8b11770e-0273-429a-a22c-b61245f7023e"

[observability]
enabled = true
head_sampling_rate = 1
