name = "football-edge-background-watch"
main = "worker.js"
compatibility_date = "2026-09-11"

[vars]
APISPORTS_BASE = "https://v3.football.api-sports.io"
TZ = "Asia/Ho_Chi_Minh"
FOCUS_INTERVAL_MS = "30000"
SCREEN_INTERVAL_MS = "60000"
DETAIL_FOCUS_MS = "60000"
DETAIL_SCREEN_MS = "180000"
MAX_DETAIL_PER_TICK = "6"
MAX_ACTIVE_WATCHES = "120"
MAX_FOCUS_WATCHES = "16"
WATCH_PERSIST_HEARTBEAT_MS = "300000"
LOOKUP_FOCUS_MS = "120000"
LOOKUP_SCREEN_MS = "300000"

[durable_objects]
bindings = [
  { name = "BACKGROUND_WATCHER", class_name = "BackgroundWatcher" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BackgroundWatcher"]

# V1.23.1 D1 DATABASE
# Sau khi chạy: npx wrangler d1 create football-edge-db
# hãy bỏ dấu # ở 4 dòng dưới và thay REPLACE_WITH_D1_DATABASE_ID bằng database_id Cloudflare trả về.
# [[d1_databases]]
# binding = "FOOTBALL_DB"
# database_name = "football-edge-db"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"

[observability]
enabled = true
head_sampling_rate = 1
